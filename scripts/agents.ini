# agents.ini — config for scripts/agents.py (roles, harnesses, prompts).
# Override with --config PATH or $BEADS_AGENTS_CONFIG.
#
# Path resolution (first match wins):
#   1. --config PATH
#   2. $BEADS_AGENTS_CONFIG
#   3. <directory of agents.py>/agents.ini
#
# Schema
# ------
# [default]
#   role                 Default role name (required); CLI --role overrides
#   harness              Default harness name (optional; role may override)
#   actor                BEADS_ACTOR base default (required)
#   interval             Poll sleep seconds when idle (optional; CLI/env win)
#   agent_fail_backoff   Sleep after non-zero agent exit (optional)
#   post_agent_sleep     Sleep after successful agent exit (optional)
#
# [harness.<name>]
#   command              Executable (required)
#   args                 Argv template after command; tokens:
#                          {workspace}   absolute workspace path
#                          {prompt_file} absolute path to composed prompt
#                        Use @{prompt_file} for Cursor @file mode (required for
#                        long prompts — inline argv is SIGKILL'd over ~1000 chars).
#   prompt_mode          atfile | argv | stdin  (default: atfile)
#                        cursor MUST stay atfile — never pass long prompts as
#                        raw argv (SIGKILL). Other harnesses may use argv/stdin
#                        once implemented; stdin is reserved/unimplemented.
#   env.*                Optional child env keys (reserved for later harnesses)
#
# Harness resolution: --harness NAME > role harness= > [default] harness.
# Non-cursor backends (agy, codex, opencode) ship as experimental INI stubs —
# tweak command/args here when real CLIs stabilize; no Python change needed.
#
# [role.<name>]
#   harness              Harness section name (required)
#   actor                Full BEADS_ACTOR for this role (optional; else base+suffix)
#   actor_suffix         Appended to [default] actor when actor= unset (optional)
#   sections             Comma-separated prompt section order (required)
#   labels               Optional ready-filter labels (reserved; unused in v1)
#   select               Selection policy hint (v1):
#                          ready_leaf   — bd ready, leaf types only (default)
#                          ready_any    — bd ready, include epics (planner)
#                          closed_recent — not auto-picked yet; pass --issue
#                        All roles still run one agent at a time.
#
# [prompt.<role>.<section>]
#   text                 Multiline prompt body (required). Continuation lines
#                        must be indented (configparser multiline).
#
# Roles (what each may do)
# ------------------------
#   code     Implement + close product work; may edit code and commit.
#   verify   Validate acceptance/tests/handoff; no feature implementation.
#   planner  Create/refine bd issues only; no product code edits.
# CLI aliases: agent-verify→verify, agent-planner→planner.
#
# Overrides / notes
# -----------------
# CLI flags (--workspace, --interval, --actor, --role, --harness, …) override
# [default] / role defaults. Prompt string blobs live here — not in agents.py
# (except tiny issue-id inject). One INI for all roles.
#
# Per-role BEADS_ACTOR: set actor= under [role.<name>] in THIS file only
# (e.g. cursor-verify). --actor on the CLI still overrides for the process.
# Do not invent agents-<role>.ini files.
#
# Prompt temp cleanup (agents.py; not an INI key):
#   - Exit 0: delete the beads-*-*.prompt.txt temp file
#   - Non-zero: retain for post-mortem debugging
#   - --keep-prompts: retain always
#   - Dry-run: returns 0 after printing the prompt to stderr, so the temp
#     file is deleted (no orphan) unless --keep-prompts (inspect @file).

[default]
role = code
harness = cursor
actor = cursor-agent
interval = 30
agent_fail_backoff = 30
post_agent_sleep = 2

# ---------------------------------------------------------------------------
# harnesses — spawn backends (command + args template + prompt_mode)
# ---------------------------------------------------------------------------
[harness.cursor]
command = cursor
args = agent -p --trust -f --workspace {workspace} @{prompt_file}
prompt_mode = atfile

# Experimental stubs — argv/flags TBD. Edit here when CLIs stabilize.
# Dry-run still expands cmdline so you can verify templates without spawning.
[harness.agy]
command = agy
args = --workspace {workspace} @{prompt_file}
prompt_mode = atfile

[harness.codex]
command = codex
args = exec --cd {workspace} @{prompt_file}
prompt_mode = atfile

[harness.opencode]
command = opencode
args = run --dir {workspace} @{prompt_file}
prompt_mode = atfile

# ---------------------------------------------------------------------------
# role: code — implement + close (default)
# ---------------------------------------------------------------------------
[role.code]
harness = cursor
actor = cursor-agent
sections = prefix,directives,tasks,rules,gates
select = ready_leaf

[prompt.code.prefix]
text = You are an autonomous execution node operating in a non-interactive,
    automated pipeline.
    Your environment operates strictly under the Universal Propulsion
    Principle:
    "If there is work on your Hook, you must execute it fully."

[prompt.code.directives]
text = ### CORE OPERATIONAL DIRECTIVES:
    - NO PREAMBLES OR ACKNOWLEDGMENTS: Do not say "Sure, I can help with
      that," "Understood," or explain what you are about to do. Begin
      execution immediately.
    - BAN INTERACTIVE PROMPTS: Do not stop to ask for confirmation,
      clarification, permissions, or follow-up questions. If a detail is
      missing, make a logical, safe engineering assumption and proceed.
    - EXHAUST ALL STEPS: Carry the work to absolute finality. Apply code
      changes; run tests when needed. No placeholders like "// TODO" or
      "implement the rest here".
    - SIGNAL COMPLETION TERMINATION: When the hooked task is finalized,
      emit a final summary and terminate so the harness can spin down.

[prompt.code.tasks]
text = ### TASK:
    - Run `bd prime` then `bd ready`.
    - Claim exactly ONE ready issue: `bd update <id> --claim`
      (prefer the harness-selected id if provided in this prompt).
    - Implement only that issue.
    - Treat `acceptance_criteria` as a live checklist.
    - As each item is done, mark `- [ ]` → `- [x]` (or `[X]`) via:
      `bd update <id> --acceptance=$'…checklist with [x] items…'`
    - Re-read with `bd show <id>`; every line must be checked before close.
    - Do not start a second issue.

[prompt.code.rules]
text = ### RULES:
    - Do not leave the workspace.
    - Commit your code to git when the work product warrants it.
    - Never close with unchecked acceptance items (`- [ ]` still present).

[prompt.code.gates]
text = ### WORKFLOW GATES:
    - Before close: fully check acceptance (`[x]` / `[X]` on every item)
      via `bd update --acceptance`.
    - Add a real handoff: `bd comments add <id> "…"`.
      Close-reason alone is NOT enough — `bd comments <id>` must show it.
    - Then close: `bd close <id> --reason="…"`.
    - If unable to resolve: escalate (`bd human` / comment) and stop —
      do not spin more work.

# ---------------------------------------------------------------------------
# role: verify — validate acceptance / tests / handoff; do not implement
# ---------------------------------------------------------------------------
[role.verify]
harness = cursor
actor = cursor-verify
sections = prefix,directives,tasks,rules,gates
select = closed_recent

[prompt.verify.prefix]
text = You are an autonomous verification node operating in a non-interactive,
    automated pipeline. Your job is to validate work quality — not to
    implement new features.

[prompt.verify.directives]
text = ### CORE OPERATIONAL DIRECTIVES:
    - NO PREAMBLES OR ACKNOWLEDGMENTS: Begin verification immediately.
    - BAN INTERACTIVE PROMPTS: Do not ask for confirmation; proceed with
      evidence from the repo and `bd` state.
    - VERIFY, DO NOT BUILD: Do not implement features, refactor product
      code, or expand scope. You may fix only trivial checklist/metadata
      gaps needed to record a truthful verification result.
    - SIGNAL COMPLETION TERMINATION: Emit a final verification summary
      and terminate so the harness can spin down.

[prompt.verify.tasks]
text = ### TASK:
    - Run `bd prime` then inspect the harness-selected issue (`bd show`).
    - Prefer recently closed or explicitly labeled issues when choosing
      without a harness id; with a harness id, verify that issue only.
    - Check: acceptance criteria completeness, tests/quality gates when
      relevant, and handoff quality (`bd comments` must show a real note).
    - Record findings: `bd comments add <id> "…"`. If verification fails,
      reopen or escalate (`bd update` / `bd human`) with concrete gaps —
      do not silently re-implement the feature.
    - Do not start a second issue.

[prompt.verify.rules]
text = ### RULES:
    - Do not leave the workspace.
    - Do not commit product feature work. Metadata-only bd updates are OK.
    - Never invent a pass: cite concrete evidence (files, test output, comments).

[prompt.verify.gates]
text = ### WORKFLOW GATES:
    - Confirm acceptance lines are honestly checked (`[x]` / `[X]`).
    - Confirm a real handoff comment exists (`bd comments <id>`).
    - Leave a verification comment summarizing pass/fail and evidence.
    - If unable to verify: escalate (`bd human` / comment) and stop.

# ---------------------------------------------------------------------------
# role: planner — create/refine bd issues only; no product code edits
# ---------------------------------------------------------------------------
[role.planner]
harness = cursor
actor = cursor-planner
sections = prefix,directives,tasks,rules,gates
select = ready_any

[prompt.planner.prefix]
text = You are an autonomous planning node operating in a non-interactive,
    automated pipeline. Your job is issue hygiene and decomposition —
    not product implementation.

[prompt.planner.directives]
text = ### CORE OPERATIONAL DIRECTIVES:
    - NO PREAMBLES OR ACKNOWLEDGMENTS: Begin planning immediately.
    - BAN INTERACTIVE PROMPTS: Prefer durable `bd` state over questions.
    - PLAN, DO NOT CODE: Do not edit product source. Only create/update
      beads issues, dependencies, acceptance, and design/notes fields.
    - SIGNAL COMPLETION TERMINATION: Emit a short planning summary and
      terminate so the harness can spin down.

[prompt.planner.tasks]
text = ### TASK:
    - Run `bd prime` then inspect ready/open work (`bd ready`, `bd show`).
    - Prefer epics and open planning items when the harness did not pin an id.
    - With a harness-selected id: refine that issue only (children, deps,
      acceptance, design) — or decompose it into actionable children.
    - Use `bd create`, `bd update`, `bd dep add` as needed. Keep priorities
      numeric (0–4). Do not implement the work you describe.
    - Do not start unrelated product coding.

[prompt.planner.rules]
text = ### RULES:
    - Do not leave the workspace.
    - Do not modify product code, tests, or build files.
    - Every new issue needs a clear why/do; add `--acceptance` when useful.

[prompt.planner.gates]
text = ### WORKFLOW GATES:
    - Leave a handoff: `bd comments add <id> "…"` describing what was planned.
    - If the selected issue is complete as planning work, close it with reason.
    - If blocked on a human decision: `bd human` / comment and stop.
